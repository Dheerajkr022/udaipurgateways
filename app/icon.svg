<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083782"/>
      <stop offset="50%" stop-color="#062B67"/>
      <stop offset="100%" stop-color="#031D47"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA834"/>
      <stop offset="50%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#D96305"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Gold Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Royal Mewar Sun Motif at Top -->
  <g transform="translate(256, 120)">
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="28" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="20" fill="#FFE082"/>
    <!-- Sun Rays -->
    <path d="M 0,-44 L 0,-34 M 0,34 L 0,44 M -44,0 L -34,0 M 34,0 L 44,0 M -31,-31 L -24,-24 M 24,24 L 31,31 M -31,31 L -24,24 M 24,-24 L 31,-31" 
          stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Iconic Rajasthan Mewar Gateway Arch -->
  <path d="M 120,410 L 120,270 
           C 120,230 150,195 190,185 
           C 205,180 220,182 232,192 
           C 240,198 248,205 256,212 
           C 264,205 272,198 280,192 
           C 292,182 307,180 322,185 
           C 362,195 392,230 392,270 
           L 392,410" 
        fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Inner Decorative Arch -->
  <path d="M 148,410 L 148,278 
           C 148,245 170,218 200,210 
           C 214,206 226,209 236,217 
           C 244,223 250,228 256,233 
           C 262,228 268,223 276,217 
           C 286,209 298,206 312,210 
           C 342,218 364,245 364,278 
           L 364,410" 
        fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3" stroke-linecap="round"/>

  <!-- Stylized Palace Gateway Finial / Kalash -->
  <path d="M 256,160 L 256,188 M 248,172 L 264,172" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Brand Typography: UG (Udaipur Gateway) Monogram -->
  <text x="202" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="125" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2" filter="url(#shadow)">U</text>
  <text x="310" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="125" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2" filter="url(#shadow)">G</text>

  <!-- Lake Pichola Waves Base -->
  <path d="M 160,420 Q 185,410 210,420 T 260,420 T 310,420 T 352,420" 
        fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M 180,436 Q 205,428 230,436 T 280,436 T 332,436" 
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>